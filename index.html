<style>
  :root {
    --tgms-blue: #003366;
    --tgms-light: #f5f7fa;
    --tgms-accent: #0066cc;
    --tgms-text: #222222;
    --tgms-muted: #666666;
    --tgms-max-width: 960px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--tgms-text);
    background-color: #ffffff;
    line-height: 1.6;
  }

  a {
    color: var(--tgms-accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  header {
    background: linear-gradient(135deg, var(--tgms-blue), #001a33);
    color: white;
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-inner {
    max-width: var(--tgms-max-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 0.95rem;
    text-transform: uppercase;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 18px;
    font-size: 0.9rem;
  }

  nav a {
    color: #e7edf7;
    opacity: 0.9;
  }

  nav a:hover {
    opacity: 1;
  }

  main {
    padding: 32px 16px 40px;
  }

  .section {
    max-width: var(--tgms-max-width);
    margin: 0 auto 40px;
    scroll-margin-top: 90px;
  }

  /* HERO */
  .hero {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 32px;
    align-items: center;
    padding-top: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid #dde3ee;
  }

  .hero-title {
    font-size: clamp(2rem, 3vw, 2.6rem);
    font-weight: 700;
    color: var(--tgms-blue);
    margin-bottom: 8px;
  }

  .hero-tagline {
    font-size: 1rem;
    font-style: italic;
    color: var(--tgms-muted);
    margin-bottom: 16px;
  }

  .hero-subtitle {
    font-size: 1rem;
    color: var(--tgms-text);
    margin-bottom: 20px;
  }

  .hero-highlight {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #c5d2e5;
    font-size: 0.8rem;
    color: var(--tgms-muted);
    margin-bottom: 12px;
  }

  .hero-cta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-primary {
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    background-color: var(--tgms-accent);
    color: white;
  }

  .btn-primary:hover {
    background-color: #0052a3;
  }

  .btn-outline {
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    background-color: transparent;
    color: var(--tgms-accent);
    border: 1px solid #c5d2e5;
  }

  .btn-outline:hover {
    background-color: #eef3fb;
  }

  .hero-sidebox {
    background-color: var(--tgms-light);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 0.85rem;
    color: var(--tgms-muted);
    border: 1px solid #dde3ee;
  }

  /* Insights PDF button */
  .insight-actions .btn-outline {
    padding: 4px 10px;
    font-size: 0.75rem;
    border-radius: 6px;
    margin-top: 6px;
  }

  .insight-actions {
    margin-top: 4px;
  }

  /* CONTACT */
  .contact-wrapper {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr);
    gap: 28px;
    align-items: flex-start;
    margin-top: 16px;
  }

  .contact-box {
    background-color: var(--tgms-light);
    border-radius: 12px;
    padding: 16px 18px;
    border: 1px solid #dde3ee;
  }

  form {
    display: grid;
    gap: 10px;
    font-size: 0.9rem;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #c5d2e5;
  }

  /* --- MOBILE FIX (スマホ版崩れ修正) --- */
  @media (max-width: 768px) {

    .nav-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    nav ul {
      flex-wrap: wrap;
    }

    .hero {
      grid-template-columns: 1fr;
    }

    .contact-wrapper {
      grid-template-columns: 1fr;
    }

    .section {
      scroll-margin-top: 70px;
    }
  }

  footer {
    border-top: 1px solid #dde3ee;
    padding: 16px;
    font-size: 0.8rem;
    color: var(--tgms-muted);
    text-align: center;
    background-color: #fafbfe;
    margin-top: 8px;
  }
</style>
